<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%assets/logo/nextmusic-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Discover artists, albums and songs with NextMusic. Search the iTunes catalogue, explore matching results and listen to available audio previews." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://is1-ssl.mzstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>
    <title>NextMusic — Explore the world of music</title>
  </head>
  <body>
    <div id="root">
      <div style="font-family: Arial, Helvetica, sans-serif; color: #171717; background: #fff; min-height: 100vh">
        <header style="padding: 24px max(24px, 6vw); background: #171717; color: white; font-size: 28px">next music</header>
        <main style="padding: 64px max(24px, 6vw); max-width: 760px">
          <p style="letter-spacing: 0.2em; font-size: 13px">MUSIC DISCOVERY</p>
          <h1 style="font-size: clamp(40px, 6vw, 72px); line-height: 1.1">Explore the world of music.</h1>
          <p>Discover artists, albums and songs from the iTunes catalogue.</p>
          <p id="startup-status" role="status">Loading music search…</p>
          <noscript><p>Enable JavaScript to search the iTunes catalogue.</p></noscript>
        </main>
      </div>
    </div>
    <script type="module">
      import("/src/main.tsx").catch((error) => {
        console.error("NextMusic could not start", error);
        const status = document.getElementById("startup-status");
        if (status) {
          status.textContent = "Music search could not start. Please reload the page.";
          status.setAttribute("role", "alert");
        }
      });
    </script>
  </body>
</html>
